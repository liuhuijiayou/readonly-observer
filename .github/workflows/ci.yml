name: Synthetic platform regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
        python: ['3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the same package
        run: python -m pip install .
      - name: Synthetic tests (no runtime keys, sessions or tunnels)
        run: python -I scripts/test_suite.py
      - name: Root-only legacy staging regressions
        if: runner.os == 'Linux'
        run: sudo "$(command -v python)" -I scripts/test_suite.py --pattern test_systemd219.py
      - name: Root wizard transactions and hidden TTY input
        if: runner.os == 'Linux'
        run: sudo "$(command -v python)" -I scripts/test_suite.py --pattern test_linux_wizard.py
      - name: Actual systemd wizard install upgrade and rollback
        if: runner.os == 'Linux'
        run: sudo "$(command -v python)" -I scripts/linux_wizard_smoke.py
      - name: Real systemd Credentials with a synthetic client
        if: runner.os == 'Linux'
        run: sudo "$(command -v python)" -I scripts/systemd_smoke.py
      - name: Check reviewed public tree
        run: python -I scripts/check_repository.py
      - name: Build and inspect artifacts
        run: |
          python -m pip install build
          python -m build
          python -I scripts/check_release.py dist/*.whl dist/*.tar.gz
